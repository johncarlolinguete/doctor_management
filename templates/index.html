<!DOCTYPE html>
<html>
<head>
    <title>Doctor Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Doctor Management System</h1>
        <a href="{{ url_for('add_doctor') }}" class="btn btn-primary mb-3">Add New Doctor</a>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for doctor in doctors %}
                <tr>
                    <td>{{ doctor['name'] }}</td>
                    <td>{{ doctor['email'] }}</td>
                    <td>{{ doctor['phone'] }}</td>
                    <td>{{ doctor['department'] }}</td>
                    <td>
                        <a href="{{ url_for('edit_doctor', doctor_id=doctor['id']) }}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{{ url_for('delete_doctor', doctor_id=doctor['id']) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this doctor?');">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
